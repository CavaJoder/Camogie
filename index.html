<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./icons/icon-192x192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#bb86fc" />
  <meta name="description" content="Track and analyze match performance statistics" />

  <title>Performance Analysis Tracker</title>
</head>

<body>
  <!-- SW KILLER: Aggressively remove any service workers to fix cache issues -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister().then(() => console.log('SW Kill: Success'));
        }
      });
      // Also clear caches
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (let name of names) caches.delete(name);
        });
      }
    }
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
